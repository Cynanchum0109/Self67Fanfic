<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67Cynanchum</title>
    <!-- 图标路径一律用相对路径：离线双击 index.html（file://）时绝对路径取不到 -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="shortcut icon" href="./favicon.ico">
    <!-- 不同尺寸的 PNG 图标 -->
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" href="./assets/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">
    <!-- 字体走 CDN；离线打开时取不到会按 src/index.css 里的字体栈回落到系统字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="text-gray-900">
    <div id="root"></div>
    <!-- 兜底提示：3 秒后还没挂载，多半是把需要服务器的 dist/ 直接用 file:// 打开了
         （浏览器不允许 file:// 加载外部 ES module，整页会白屏且没有任何提示）。
         离线版能正常挂载，永远不会走到这里。样式写死是因为那种情况下 CSS 也被拦了。 -->
    <script>
      setTimeout(function () {
        var r = document.getElementById('root');
        if (!r || r.hasChildNodes()) return;
        r.innerHTML =
          '<div style="max-width:34em;margin:18vh auto;padding:0 1.5em;font:400 15px/1.8 system-ui,sans-serif;color:#4E4462;text-align:center">' +
          '<p style="font-size:20px;margin:0 0 .8em">页面没能加载</p>' +
          '<p style="margin:0 0 .8em">这份产物需要通过服务器访问，直接双击打开是不行的。</p>' +
          '<p style="margin:0">要本地离线打开，请用 <code style="background:#F0EDF5;padding:.15em .45em;border-radius:4px">dist-offline/index.html</code>（<code style="background:#F0EDF5;padding:.15em .45em;border-radius:4px">npm run build:offline</code> 生成）。</p>' +
          '<p style="margin:1.6em 0 0;font-size:13px;color:#9A93A8">This build must be served over http(s). For offline use, open dist-offline/index.html instead.</p>' +
          '</div>';
      }, 3000);
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
